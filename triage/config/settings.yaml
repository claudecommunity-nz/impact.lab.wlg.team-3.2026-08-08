# Runtime settings for the triage prototype.
# Edited live from the Settings tab, or by hand — the server reloads on change.

engine:
  # rules  = deterministic ruleset only (fast, fully explainable)
  # llm    = ask the local model to classify each report
  # hybrid = run rules first, then ask the LLM; disagreements are surfaced to
  #          the operator instead of being resolved silently.
  mode: hybrid

  # In hybrid mode, ignore the LLM verdict below this confidence.
  llm_min_confidence: 0.45

  # The LLM is never allowed to *lower* a priority the ruleset raised.
  # Machines may escalate; only a human may de-escalate.
  llm_may_downgrade: false

llm:
  # anthropic = Claude API (needs CLAUDE_API_KEY in triage/.env)
  # ollama    = local model, no API key, nothing leaves the machine
  provider: anthropic

  # --- Claude API -----------------------------------------------------------
  model: claude-opus-5
  timeout_s: 180
  # On a policy decline the API re-runs the request on Anthropic's recommended
  # fallback model in the same call, so a false positive on emergency content
  # (injury, fire, entrapment) doesn't cost us the reporting.
  refusal_fallbacks: true
  # Effort per job. Classification is high-volume and wants to be quick;
  # drafting a ruleset is the one genuinely hard reasoning task here.
  classify_effort: low
  classify_max_tokens: 4096
  ruleset_effort: high
  ruleset_max_tokens: 32000
  handover_effort: high
  handover_max_tokens: 8000

  # --- Ollama (used only when provider: ollama) -----------------------------
  base_url: http://localhost:11434
  ollama_model: qwen3.5:4b
  temperature: 0
  # Strip <think>...</think> blocks that reasoning models emit before JSON.
  strip_think_tags: true

dedupe:
  # Consolidation: reportings about the same event collapse into one queue row.
  # The test is location proximity + sentiment + category (see dedupe.py).
  enabled: true
  # "Very close proximity" — two reportings must be within this many metres of
  # each other to be the same event. Gazetteer-inferred pins sit at a suburb
  # centroid, so this also stops two ends of a suburb merging.
  distance_m: 250
  time_window_minutes: 240
  # Reportings with no location at all can still consolidate, but only on a
  # strong wording match (>= 50%) standing in for the missing place.
  allow_textonly_clustering: true

geocode:
  enabled: true
  gazetteer: data/gazetteer.json
  # Locations resolved from free text are always marked low confidence
  # in the UI. We never present a guessed pin as a known one.

forwarding:
  # dry_run keeps everything local: nothing leaves the machine, the outbound
  # payload is recorded in the audit log so you can show it on the demo.
  dry_run: true
  smtp:
    host: localhost
    port: 1025
    use_tls: false
    username: null
    password: null
    from_address: eoc-triage@wcc.example.nz

ui:
  # Which priorities are plotted on the map tab.
  map_priorities: [action_required, verification_required]
  refresh_seconds: 2
  map_centre: [-41.2865, 174.7762]
  map_zoom: 12

audit:
  # Who the UI attributes changes to until real auth exists.
  default_actor: duty.controller
